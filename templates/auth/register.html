{% extends "base.html" %}{% block title %}Sign up · Blogly{% endblock %}
{% block content %}
<section class="card narrow"><h1>Create account</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" autocomplete="username" value="{{ request.form.username or '' }}"></label>
    <label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
    <label>Confirm password<input name="confirm" type="password" required minlength="6" autocomplete="new-password"></label>
    <button class="btn primary">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
