<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Blogly{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="{{ url_for('posts.index') }}"><span class="logo">B</span>Blogly</a>
    <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false">Menu</button>
    <nav id="menu" class="menu">
      <a href="{{ url_for('posts.index') }}">Home</a>
      {% if g.user %}
        <a href="{{ url_for('posts.create') }}">Write</a>
        <a href="{{ url_for('posts.profile', username=g.user.username) }}">{{ g.user.username }}</a>
        <form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="link">Log out</button></form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Log in</a>
        <a class="btn primary" href="{{ url_for('auth.register') }}">Sign up</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="page">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="foot">Blogly · Flask + SQLite</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
